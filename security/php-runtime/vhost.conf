<VirtualHost *:80 *:5000>
    DocumentRoot /app/public
    <Directory /app/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>
    <DirectoryMatch "^/app/(application|system|vendor)(/|$)">
        Require all denied
    </DirectoryMatch>
    <DirectoryMatch "(^|/)\.[^/]+">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
